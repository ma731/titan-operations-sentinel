server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The console is a single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/run is a Server-Sent Events stream. Without these three lines nginx
        # buffers it and the console shows nothing until the run finishes, which looks
        # exactly like a hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}

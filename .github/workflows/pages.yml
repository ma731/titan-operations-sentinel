name: deploy console to pages

# Publishes the web console to GitHub Pages so a reviewer can open the demo without
# cloning anything. What is deployed is Replay mode: a recorded run played back in the
# browser. It costs nothing, needs no API key, and cannot fail live in front of an
# audience. The deployed page says so on itself; see the Replay/Live toggle.

on:
  push:
    branches: [main]
    paths:
      - "webapp/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci
        working-directory: webapp/frontend

      - name: Build
        # A project site is served from /<repo>/, not /, so the bundle has to be built
        # with that base path or every asset 404s.
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
        working-directory: webapp/frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

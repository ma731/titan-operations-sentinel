name: tests

# Everything here runs without an API key, without tokens and without network access to a
# model provider. That is the point: the guarantees this system makes are enforced in
# code, so they can be checked on every push for free.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run the offline test suite
        # The live agent tests skip themselves without a key, so this is the whole
        # offline surface: tools, policy, retrieval, stream, approvals, harness.
        run: python -m pytest tests/ -q

      - name: Run the evaluation suites and enforce the floor
        # --fail-under is what makes this a gate rather than a report. The floor accounts
        # for the two open findings documented in eval/FINDINGS.md.
        run: python -m eval.run_eval --fail-under 0.97

      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-py${{ matrix.python }}
          path: eval/results/
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Ruff
        run: ruff check .

  frontend:
    name: web console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
        working-directory: webapp/frontend
      - run: npm run build
        working-directory: webapp/frontend

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The README tells a reviewer to run `docker compose up --build`. Nobody on the
      # team has Docker installed locally, so without this job that instruction is an
      # assumption. Building both images on every push turns it into a checked claim.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: titan-operations-sentinel-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: titan-operations-sentinel-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the backend and check it reports healthy
        run: |
          docker run -d --name tos-api -p 8000:8000 titan-operations-sentinel-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /tmp/health.json; then
              echo "healthy after ${i}s"; cat /tmp/health.json; exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy"; docker logs tos-api; exit 1

      - name: Check the image reports the retrieval corpus it shipped with
        run: |
          python - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h["ok"] is True, h
          # A backend image that cannot see rag/corpus would still start and still say
          # ok:true, so assert on the thing that would actually be missing.
          assert h.get("retrieval", {}).get("documents", 0) >= 10, h
          print("retrieval corpus present in the image:", h["retrieval"])
          PY

      - name: Stop the container
        if: always()
        run: docker rm -f tos-api || true

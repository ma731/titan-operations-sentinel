name: nightly evaluation

# Runs the full harness nightly and publishes the scorecard to the eval-results branch.
# Kept separate from the push job because the live suite costs tokens and depends on a
# third-party API, so a provider outage should never turn a pull request red.

on:
  schedule:
    - cron: "0 3 * * *"        # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      live:
        description: "Run the live agent suite (costs tokens)"
        type: boolean
        default: true
      limit:
        description: "Maximum live scenarios to run"
        type: string
        default: "4"

permissions:
  contents: write

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the results worktree needs real history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Decide whether the live suite can run
        id: mode
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTED: ${{ github.event_name == 'schedule' && 'true' || inputs.live }}
          LIVE_LIMIT: ${{ inputs.limit || '4' }}
        run: |
          requested="$REQUESTED"
          [[ "$LIVE_LIMIT" =~ ^[1-9][0-9]*$ ]] || { echo "limit must be a positive integer"; exit 1; }
          if [ "$requested" = "true" ] && { [ -n "$GOOGLE_API_KEY" ] || [ -n "$GROQ_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; }; then
            echo "flags=--live --limit $LIVE_LIMIT" >> "$GITHUB_OUTPUT"
            echo "Live suite enabled."
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "No provider key available: running the offline suites only."
          fi

      - name: Run the evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Embeddings score the dense and hybrid retrieval rows. Without this the
          # scorecard reports them as not configured rather than pretending.
          TOS_EMBEDDINGS: ${{ secrets.GOOGLE_API_KEY && 'auto' || '' }}
          # Flash-Lite, because the free tier is the binding constraint. Flash allows
          # 250 requests a day at 10/min; four scenarios is roughly 160 model calls, which
          # busts neither the daily cap nor the job timeout. Flash-Lite gives 1,000/day at
          # 15/min for headroom. Override with the TOS_MODEL secret if a paid key is used.
          TOS_MODEL: ${{ secrets.TOS_MODEL || (secrets.GOOGLE_API_KEY && 'google_genai:gemini-2.5-flash-lite' || '') }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          EVAL_FLAGS: ${{ steps.mode.outputs.flags }}
        run: python -m eval.run_eval $EVAL_FLAGS --fail-under 1.0 --retrieval-fail-under 0.85

      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-scorecard
          path: eval/results/
          retention-days: 30

      - name: Add the scorecard to the run summary
        if: always()
        run: cat eval/results/scorecard.md >> "$GITHUB_STEP_SUMMARY"

      # Results go to their own branch. main is protected, and CI pushing to main is the
      # wrong shape anyway. A separate branch also gives a day-by-day history of the
      # numbers without filling the main log with bot commits.
      - name: Publish results to the eval-results branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          # Only the timestamp moves on a run where nothing changed, so compare the
          # metrics instead of the file and skip the commit when they match.
          fingerprint=$(python - <<'PY'
          import hashlib, json
          d = json.load(open("eval/results/scorecard.json"))
          d.pop("generated_utc", None)
          print(hashlib.sha256(json.dumps(d, sort_keys=True, default=str).encode()).hexdigest())
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # First run: start the branch from an empty tree so it carries results only.
          if ! git ls-remote --exit-code --heads origin eval-results >/dev/null 2>&1; then
            empty=$(git hash-object -t tree /dev/null)
            git push origin "$(git commit-tree "$empty" -m 'init eval-results')":refs/heads/eval-results
          fi

          git fetch origin eval-results
          git worktree add pub origin/eval-results
          cp eval/results/scorecard.md eval/results/scorecard.json eval/results/badge.json pub/

          if [ -f pub/fingerprint.txt ] && [ "$(cat pub/fingerprint.txt)" = "$fingerprint" ]; then
            echo "Metrics unchanged since the last run, nothing to publish."
            exit 0
          fi
          echo "$fingerprint" > pub/fingerprint.txt

          summary=$(python -c "import json;d=json.load(open('eval/results/scorecard.json'))['policy'];print(f\"{d['passed']}/{d['checks']} checks, {d['overall_accuracy']*100:.1f}%\")")
          cd pub
          git add -A
          git commit -m "eval: $summary"
          git push origin HEAD:eval-results
